<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            max-width: 760px;
            margin: 40px auto;
            padding: 0 16px;
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        .status {
            margin-bottom: 20px;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 8px;
        }

        .field {
            display: block;
            margin: 12px 0;
        }

        input,
        select,
        button {
            padding: 10px;
            font: inherit;
        }

        input {
            width: 100%;
            margin-top: 5px;
        }

        select {
            margin-left: 8px;
        }

        button {
            cursor: pointer;
        }

        #sendButton,
        #loadHistoryButton {
            margin-top: 8px;
        }

        #messages {
            padding: 12px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            list-style: none;
        }

        #messages li {
            padding: 6px 0;
            overflow-wrap: anywhere;
            border-bottom: 1px solid #eee;
        }

        .system {
            color: #555;
        }

        .error {
            color: #b42318;
        }

        .online {
            color: #1a9a3c;
            cursor: pointer;
        }

        .offline {
            color: #888;
        }

        .tick {
            margin-left: 6px;
            font-size: 0.8em;
            color: #888;
        }

        .tick.read {
            color: #2a7de1;
        }

        button:disabled,
        input:disabled,
        select:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <h1>Real-Time Chat</h1>

    <section class="status">
        <p>
            Connection:
            <strong id="connectionStatus">Connecting...</strong>
            <button id="retryButton" type="button" hidden>Retry connection</button>
            <button id="logoutButton" type="button">Log out</button>
        </p>

        <p>
            Username:
            <strong id="usernameDisplay">Not authenticated</strong>
        </p>

        <p>
            Current room:
            <strong id="currentRoomDisplay">None</strong>
        </p>
    </section>

    <label class="field">
        Room:
        <select id="roomSelect" disabled>
            <option value="general">general</option>
            <option value="sports">sports</option>
            <option value="tech">tech</option>
        </select>
    </label>

    <label class="field">
        Private recipient
        <input
            id="targetInput"
            type="text"
            placeholder="Username (leave blank for room chat)"
            disabled
        >
    </label>

    <button id="loadHistoryButton" disabled>
        Load Private History
    </button>

    <label class="field">
        Message
        <input
            id="messageInput"
            type="text"
            placeholder="Type a message..."
            maxlength="500"
            disabled
        >
    </label>

    <button id="sendButton" disabled>Send</button>

    <h2>Messages</h2>
    <ul id="messages" aria-live="polite"></ul>

    <div id="online-users">
        <h3>Online Users</h3>
        <ul id="onlineUsers"></ul>
        <p>
            Recipient status:
            <strong id="targetStatus"></strong>
        </p>
    </div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // ---------- connection setup ----------
  // Initial connect failures AND later drops both use this retry budget.
  // After MAX_RETRIES failed attempts Socket.IO stops and fires "reconnect_failed".
  const MAX_RETRIES = 3;

  const socket = io({
    timeout: 5000,                  // per-attempt connect timeout
    reconnection: true,
    reconnectionAttempts: MAX_RETRIES,
    reconnectionDelay: 1000,
    reconnectionDelayMax: 4000,
    randomizationFactor: 0.5,
  });

  const connectionStatus = document.getElementById("connectionStatus");
  const retryButton = document.getElementById("retryButton");
  const usernameDisplay = document.getElementById("usernameDisplay");
  const currentRoomDisplay = document.getElementById("currentRoomDisplay");
  const roomSelect = document.getElementById("roomSelect");
  const targetInput = document.getElementById("targetInput");
  const targetStatus = document.getElementById("targetStatus");
  const onlineUsersList = document.getElementById("onlineUsers");
  const messageInput = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const loadHistoryButton = document.getElementById("loadHistoryButton");
  const messages = document.getElementById("messages");
  const logoutButton = document.getElementById("logoutButton");

  // id -> { li, tick }. Used for dedupe AND for updating ticks later.
  const messageEls = new Map();
  // message-status events that arrive before we rendered the message
  const earlyStatuses = new Map();
  // usernames currently online (lowercase)
  const onlineUsers = new Set();

  let username = "";
  let authenticated = false;
  let joinedRoom = "";

  let isLoadingHistory = false;
  let pendingLiveMessages = [];
  let historyTimer = null;

  // Outbox: the one unconfirmed message. Kept until the server acks it, and
  // resent with the SAME clientMsgId, so the server's UNIQUE index makes a
  // retry a no-op instead of a duplicate row.
  let outbox = null;          // { clientMsgId, text, to, room }
  let inFlight = false;
  let attemptId = 0;          // lets us ignore callbacks from a dead connection

  let authRetried = false;    // one refresh attempt per auth failure
  let hasAuthenticatedOnce = false;  // keeps reconnects from spamming the log

  const TICKS = { sent: "✓", delivered: "✓✓", read: "✓✓" };

  // ---------- rendering helpers ----------
  function setTick(entry, status) {
    if (!entry || !entry.tick) return;
    entry.tick.textContent = TICKS[status] || "";
    entry.tick.className = "tick " + status;
  }

  function addMessage(text, className = "", messageId = null, status = null) {
    if (messageId !== null) {
      const existing = messageEls.get(messageId);
      if (existing) {
        // Duplicate: don't render twice, but allow a tick upgrade (e.g. from history)
        if (status) setTick(existing, status);
        return;
      }
    }

    const li = document.createElement("li");
    if (className) li.className = className;

    const span = document.createElement("span");
    span.textContent = text;
    li.appendChild(span);

    let tick = null;
    if (status) {
      tick = document.createElement("span");
      li.appendChild(tick);
    }

    messages.appendChild(li);
    messages.scrollTop = messages.scrollHeight;

    if (messageId !== null) {
      const entry = { li, tick };
      messageEls.set(messageId, entry);
      if (status) {
        const early = earlyStatuses.get(messageId);
        setTick(entry, early || status);
        earlyStatuses.delete(messageId);
      }
    }
  }

  // ---------- presence ----------
  function renderPresence() {
    onlineUsersList.textContent = "";
    for (const name of [...onlineUsers].sort()) {
      if (name === username.toLowerCase()) continue; // don't list yourself
      const li = document.createElement("li");
      li.textContent = "● " + name;
      li.className = "online";
      li.addEventListener("click", () => {
        targetInput.value = name;
        renderTargetStatus();
      });
      onlineUsersList.appendChild(li);
    }
    renderTargetStatus();
  }

  function renderTargetStatus() {
    const t = targetInput.value.trim().toLowerCase();
    if (!t) {
      targetStatus.textContent = "";
      return;
    }
    const online = onlineUsers.has(t);
    targetStatus.textContent = online ? "● online" : "○ offline";
    targetStatus.className = online ? "online" : "offline";
  }

  function updateControls() {
    const ready = socket.connected && authenticated;
    roomSelect.disabled = !ready;
    targetInput.disabled = !ready;
    messageInput.disabled = !ready;
    sendButton.disabled = !ready || inFlight;
    loadHistoryButton.disabled = !ready;
  }

  // ---------- room history loading ----------
  // Live room messages that arrive while history is loading are held, then
  // shown after the history, so nothing is lost or shown out of order.
  function startHistoryLoad() {
    isLoadingHistory = true;
    pendingLiveMessages = [];
    clearTimeout(historyTimer);
    // Safety net: never hold live messages forever if the join fails
    historyTimer = setTimeout(finishHistoryLoad, 8000);
  }

  function finishHistoryLoad() {
    clearTimeout(historyTimer);
    isLoadingHistory = false;
    for (const m of pendingLiveMessages) {
      addMessage("[" + m.room + "] " + m.from + ": " + m.text, "", m.id);
    }
    pendingLiveMessages = [];
  }

  function cancelHistoryLoad() {
    clearTimeout(historyTimer);
    isLoadingHistory = false;
    pendingLiveMessages = [];
  }

  // ---------- sending (outbox) ----------
  function sendMessage() {
    if (!socket.connected || !authenticated) {
      addMessage("You are not connected or authenticated.", "error");
      return;
    }

    // An earlier message is still unconfirmed: retry THAT one (same clientMsgId)
    if (outbox) {
      if (inFlight) {
        addMessage("Previous message is still being sent...", "system");
        return;
      }
      messageInput.value = outbox.text;
      addMessage("Retrying your unsent message.", "system");
      transmit();
      return;
    }

    const text = messageInput.value.trim();
    const to = targetInput.value.trim();

    if (!text) {
      addMessage("Message cannot be empty.", "error");
      return;
    }
    if (!to && !joinedRoom) {
      addMessage("Join a room before sending a room message.", "error");
      return;
    }

    outbox = {
      clientMsgId: crypto.randomUUID(),
      text,
      to,
      room: to ? "" : joinedRoom,
    };
    transmit();
  }

  function transmit() {
    if (!outbox || inFlight || !socket.connected || !authenticated) return;

    inFlight = true;
    const myAttempt = ++attemptId;
    const sent = outbox;
    updateControls();

    socket.timeout(5000).emit(
      "message",
      { clientMsgId: sent.clientMsgId, text: sent.text, to: sent.to },
      (error, result) => {
        // The connection died and a newer attempt took over: ignore this one
        if (myAttempt !== attemptId) return;

        inFlight = false;
        updateControls();

        if (error) {
          // Keep the outbox. It is resent on reconnect or when Send is pressed.
          addMessage("No acknowledgement. Will retry on reconnect or press Send.", "system");
          return;
        }
        if (!result || !result.ok) {
          outbox = null;
          addMessage("[Error] " + (result ? result.message : "No result from server."), "error");
          return;
        }

        outbox = null;

        if (result.target === "private") {
          addMessage("You → " + result.recipient + ": " + sent.text, "", result.id, "sent");
        } else {
          addMessage("You [#" + result.room + "]: " + sent.text, "", result.id);
        }

        messageInput.value = "";
        messageInput.focus();
      }
    );
  }

  // ---------- private history ----------
  function loadPrivateHistory(otherUsername) {
    if (!socket.connected || !authenticated) {
      addMessage("Connect and authenticate before loading history.", "error");
      return;
    }

    const recipient = otherUsername.trim();
    if (!recipient) {
      addMessage("Enter a username to load private history.", "error");
      return;
    }

    loadHistoryButton.disabled = true;

    socket.timeout(5000).emit("private-history", recipient, (error, result) => {
      loadHistoryButton.disabled = !socket.connected || !authenticated;

      if (error) {
        addMessage("No response received while loading history.", "error");
        return;
      }
      if (!result) {
        addMessage("The server returned no history result.", "error");
        return;
      }
      if (!result.ok) {
        addMessage("[Error] " + result.message, "error");
        return;
      }

      addMessage("--- Private history with " + recipient + " ---", "system");

      if (result.messages.length === 0) {
        addMessage("No previous private messages found.", "system");
        return;
      }

      for (const m of result.messages) {
        const mine = m.sender_username.toLowerCase() === username.toLowerCase();
        const status = mine
          ? m.read_at ? "read" : m.delivered_at ? "delivered" : "sent"
          : null;

        addMessage(
          "[Private] " + (mine ? "You" : m.sender_username) + ": " + m.content,
          "",
          m.id,
          status
        );
      }
    });
  }

  // ---------- connection lifecycle ----------
  socket.on("connect", () => {
    authRetried = false;
    retryButton.hidden = true;

    connectionStatus.textContent = "Connected — restoring session";
    authenticated = false;       // gates sending until the server confirms us
    joinedRoom = "";
    currentRoomDisplay.textContent = "Joining...";
    // Keep showing the known username on a reconnect; only a first-ever
    // connect has nothing to show yet.
    usernameDisplay.textContent = username || "Authenticating...";
    updateControls();
    if (!hasAuthenticatedOnce) {
      addMessage("Socket connected. Waiting for authenticated identity.", "system");
    }
  });

  socket.on("current-user", (user) => {
    username = user.username;
    authenticated = true;
    connectionStatus.textContent = "Connected";
    usernameDisplay.textContent = username;
    updateControls();
    if (!hasAuthenticatedOnce) {
      addMessage("Authenticated as " + username + ".", "system");
      hasAuthenticatedOnce = true;
    }

    // A pending room message must go to the room it was written for
    if (outbox && !outbox.to && outbox.room) {
      roomSelect.value = outbox.room;
    }

    // Hold live room messages until the room history arrives
    startHistoryLoad();
    socket.emit("join-room", roomSelect.value);

    // Resend any unconfirmed message AFTER the join, with the same clientMsgId.
    // Events are processed in order, so the room is set before this arrives.
    transmit();
  });

  socket.on("disconnect", (reason) => {
    connectionStatus.textContent = "Disconnected";
    // Keep the username: a dropped connection is not a logout, and the
    // browser re-sends its login cookie automatically on reconnect.
    usernameDisplay.textContent = username ? username + " (offline)" : "Not authenticated";
    currentRoomDisplay.textContent = "None";

    authenticated = false;       // can't send until the server confirms us again
    joinedRoom = "";

    // Any ack still pending belongs to the dead connection
    inFlight = false;
    attemptId++;

    cancelHistoryLoad();

    // Presence is unknown while offline; the snapshot rebuilds it on reconnect
    onlineUsers.clear();
    renderPresence();

    updateControls();

    if (reason === "io server disconnect") {
      // The server closed the socket on purpose (e.g. a restart).
      // Socket.IO does NOT auto-reconnect in this case, so do it manually.
      addMessage("Server closed the connection. Reconnecting...", "error");
      socket.connect();
    } else if (reason === "io client disconnect") {
      addMessage("Disconnected.", "error");
    } else {
      addMessage("Connection lost (" + reason + "). Trying to reconnect...", "error");
    }
  });

  socket.on("connect_error", async (error) => {
    console.error("Socket connection error:", error.message);

    if (error.message === "unauthorized") {
      // Auth failures are not retried by Socket.IO. Try one refresh, then login.
      if (authRetried) {
        window.location.href = "/login.html";
        return;
      }
      authRetried = true;
      connectionStatus.textContent = "Refreshing session...";
      try {
        const res = await fetch("/auth/refresh", {
          method: "POST",
          credentials: "same-origin",
        });
        if (res.ok) {
          socket.connect();     // retry with the new access cookie
          return;
        }
      } catch (e) {
        console.error("Refresh request failed:", e);
      }
      window.location.href = "/login.html";
      return;
    }

    // Network/server errors: Socket.IO retries on its own (reconnect_attempt)
    connectionStatus.textContent = "Connection failed";
    updateControls();
  });

  // Fires for every retry, including when the very first connect fails
  socket.io.on("reconnect_attempt", (attempt) => {
    connectionStatus.textContent = "Reconnecting (" + attempt + "/" + MAX_RETRIES + ")...";
  });

  socket.io.on("reconnect", () => {
    addMessage("Reconnected.", "system");
  });

  // All retries used up: stop and let the user decide
  socket.io.on("reconnect_failed", () => {
    connectionStatus.textContent = "Connection lost";
    addMessage("Could not reach the server after " + MAX_RETRIES + " attempts. Click Retry.", "error");
    retryButton.hidden = false;
    updateControls();
  });

  retryButton.addEventListener("click", () => {
    retryButton.hidden = true;
    connectionStatus.textContent = "Connecting...";
    socket.connect();           // starts a fresh set of attempts
  });

  // Recovery: if the network comes back after retries stopped, try again once
  window.addEventListener("online", () => {
    if (!socket.connected && !retryButton.hidden) retryButton.click();
  });

  logoutButton.addEventListener("click", async () => {
  logoutButton.disabled = true;
  socket.disconnect();   // a client-initiated disconnect never auto-reconnects
  try {
    await fetch("/auth/logout", { method: "POST", credentials: "same-origin" });
  } catch (e) {
    console.error("Logout request failed:", e);
  }
  window.location.href = "/login.html";
});

  // ---------- presence events ----------
  // Full list, sent on every (re)connect. REPLACE state, don't merge.
  socket.on("presence-snapshot", (usernames) => {
    onlineUsers.clear();
    for (const u of usernames) onlineUsers.add(String(u).trim().toLowerCase());
    renderPresence();
  });

  // Single change after that
  socket.on("user-status", (data) => {
    const u = String(data.username).trim().toLowerCase();
    if (data.status === "online") onlineUsers.add(u);
    else onlineUsers.delete(u);
    renderPresence();
  });

  // ---------- messages ----------
  // Delivery / read ticks for messages I sent
  socket.on("message-status", (data) => {
    const entry = messageEls.get(data.id);
    if (entry) setTick(entry, data.status);
    else earlyStatuses.set(data.id, data.status); // arrived before the send-ack rendered
  });

  socket.on("system", (text) => {
    addMessage("[System] " + text, "system");

    if (text.startsWith("You joined #")) {
      joinedRoom = text.substring("You joined #".length);
      currentRoomDisplay.textContent = joinedRoom;
    }

    // Join failed: no history is coming, so release any held messages
    if (text === "That room does not exist" || text === "Could not load room history") {
      finishHistoryLoad();
    }
  });

  socket.on("message", (data) => {
    if (isLoadingHistory && !data.private) {
      pendingLiveMessages.push(data);
      return;
    }

    addMessage(
      data.private
        ? "[Private] " + data.from + ": " + data.text
        : "[" + data.room + "] " + data.from + ": " + data.text,
      "",
      data.id
    );

    // Ack delivery for every private message, even duplicates (the server ignores repeats)
    if (data.private && typeof data.id === "string") {
      socket.emit("message-delivered", data.id, (result) => {
        if (!result || !result.ok) {
          console.error("Failed to acknowledge delivery:", result && result.message);
        }
      });
    }
  });

  socket.on("room-history", (history) => {
    for (const m of history) {
      addMessage(
        "[" + m.room_name + "] " + m.sender_username + ": " + m.content,
        "",
        m.id
      );
    }
    finishHistoryLoad();
  });

  // ---------- UI events ----------
  roomSelect.addEventListener("change", () => {
    if (!socket.connected || !authenticated) return;
    startHistoryLoad();
    joinedRoom = "";
    currentRoomDisplay.textContent = "Joining...";
    socket.emit("join-room", roomSelect.value);
  });

  targetInput.addEventListener("input", renderTargetStatus);
  sendButton.addEventListener("click", sendMessage);
  messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
  loadHistoryButton.addEventListener("click", () => {
    loadPrivateHistory(targetInput.value);
  });

  updateControls();
</script>
</body>
</html>
