<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Realtime Chat</title>
</head>
<body>
    <h1>Create account</h1>

    <form id="registerForm">
        <div>
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                required
                minlength="3"
                maxlength="20"
                pattern="[A-Za-z0-9_]+"
                title="3-20 characters: letters, numbers and underscore"
                autocomplete="username"
            >
        </div>

        <div>
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
            >
        </div>

        <div>
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                minlength="8"
                maxlength="72"
                autocomplete="new-password"
            >
        </div>

        <button type="submit" id="submitButton">Register</button>
        <p id="status" role="status"></p>
    </form>

    <p>Already have an account? <a href="/login.html">Log in</a></p>

    <script>
        const registerForm = document.getElementById("registerForm");
        const submitButton = document.getElementById("submitButton");
        const statusElement = document.getElementById("status");

        registerForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            submitButton.disabled = true;   // stops a double click sending two requests
            statusElement.textContent = "Creating account...";

            try {
                const response = await fetch("/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "same-origin",
                    body: JSON.stringify({ username, email, password })
                });

                let result = {};
                try {
                    result = await response.json();
                } catch {
                    // non-JSON error body (for example a 429 from the rate limiter)
                }

                if (!response.ok) {
                    statusElement.textContent =
                        result.message || "Registration failed.";
                    submitButton.disabled = false;
                    return;
                }

                // Registering does not log you in, so go to the login page
                statusElement.textContent = "Account created. Redirecting to login...";
                setTimeout(() => {
                    window.location.href = "/login.html";
                }, 800);
            } catch (error) {
                console.error("Register request failed:", error);
                statusElement.textContent =
                    "Could not reach the server. Try again.";
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
